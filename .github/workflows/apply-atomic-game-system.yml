name: Apply atomic campaign game system

on:
  push:
    branches:
      - feat/campaign-actor-inventory

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/campaign-actor-inventory
          fetch-depth: 0

      - name: Make game system explicit and atomic
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding='utf-8')
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              file.write_text(content.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'apps/api/prisma/schema.prisma',
              '  gameSystem  GameSystem         @default(PATHFINDER_2E)',
              '  gameSystem  GameSystem',
          )

          replace_once(
              'apps/api/prisma/migrations/20260729000000_initial/migration.sql',
              '  "gameSystem" "GameSystem" NOT NULL DEFAULT \'PATHFINDER_2E\',',
              '  "gameSystem" "GameSystem" NOT NULL,',
          )

          replace_once(
              'apps/api/src/modules/campaigns/routes.ts',
              "      joinPolicy: z.enum(['PUBLIC', 'PRIVATE']).default('PUBLIC'),\n",
              "      joinPolicy: z.enum(['PUBLIC', 'PRIVATE']).default('PUBLIC'),\n      gameSystem: z.enum(['PATHFINDER_2E']),\n",
          )
          replace_once(
              'apps/api/src/modules/campaigns/routes.ts',
              '          joinPolicy: parsed.data.joinPolicy,\n          createdByUserId: payload.id,',
              '          joinPolicy: parsed.data.joinPolicy,\n          gameSystem: parsed.data.gameSystem,\n          createdByUserId: payload.id,',
          )
          replace_once(
              'apps/api/src/modules/campaigns/routes.ts',
              '          joinPolicy: true,\n          createdAt: true,',
              '          joinPolicy: true,\n          gameSystem: true,\n          createdAt: true,',
          )

          replace_once(
              'apps/web/src/pages/CampaignCreatePage.tsx',
              '          joinPolicy,\n        }),',
              '          joinPolicy,\n          gameSystem,\n        }),',
          )
          replace_once(
              'apps/web/src/pages/CampaignCreatePage.tsx',
              "\n      await api(`/api/campaigns/${created.id}/game-system`, {\n        method: 'PATCH',\n        body: JSON.stringify({ gameSystem }),\n      })\n",
              '\n',
          )

          replace_once(
              'apps/api/prisma/invariants.test.sql',
              'INSERT INTO "Campaign" ("id", "title", "inviteCode", "createdByUserId", "updatedAt") VALUES\n  (\'campaign-1\', \'Campaign 1\', \'TESTC001\', \'user-1\', CURRENT_TIMESTAMP),\n  (\'campaign-2\', \'Campaign 2\', \'TESTC002\', \'user-2\', CURRENT_TIMESTAMP);',
              'INSERT INTO "Campaign" ("id", "title", "inviteCode", "gameSystem", "createdByUserId", "updatedAt") VALUES\n  (\'campaign-1\', \'Campaign 1\', \'TESTC001\', \'PATHFINDER_2E\', \'user-1\', CURRENT_TIMESTAMP),\n  (\'campaign-2\', \'Campaign 2\', \'TESTC002\', \'PATHFINDER_2E\', \'user-2\', CURRENT_TIMESTAMP);',
          )

          workflow = Path('.github/workflows/apply-atomic-game-system.yml')
          workflow.unlink()
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: require game system during campaign creation"
          git push origin HEAD:feat/campaign-actor-inventory
