name: Campaign actor final validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/campaign-actor-inventory-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply validated patch
        run: |
          cat scripts/campaign-actor-fix.part-* | base64 -d > /tmp/campaign-actor-fix.tgz
          tar -xzf /tmp/campaign-actor-fix.tgz
          python3 scripts/apply-campaign-actor-removals.py
      - run: npm ci 2>&1 | tee validation.log
      - run: npx prisma generate 2>&1 | tee -a validation.log
      - run: npx prisma validate 2>&1 | tee -a validation.log
      - run: npm run test:unit 2>&1 | tee -a validation.log
      - name: Typecheck API
        run: npx tsc --noEmit --target ES2023 --module NodeNext --moduleResolution NodeNext --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck --strictNullChecks --noUnusedLocals --noUnusedParameters apps/api/src/main.ts 2>&1 | tee -a validation.log
      - run: npm run build:web 2>&1 | tee -a validation.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-actor-validation-log
          path: validation.log
      - name: Commit validated refactor
        run: |
          rm -f scripts/campaign-actor-fix.part-*
          rm -f scripts/apply-campaign-actor-removals.py
          rm -f .github/workflows/campaign-actor-final-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: replace Character with CampaignActor" || exit 0
          git push origin HEAD:feat/campaign-actor-inventory-validation
