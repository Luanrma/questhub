name: Finalize CampaignActor refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.head_ref == 'feat/campaign-actor-inventory-finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify and extract controlled source package
        shell: bash
        run: |
          set -euo pipefail

          cat scripts/campaign-actor-payload-{00..16} \
            | base64 --decode > /tmp/campaign-actor-final.tgz

          echo "39501a1f3a612c28a69db673b0784342acc90b3a1be33c85e2e0f800e5badce8  /tmp/campaign-actor-final.tgz" \
            | sha256sum -c -

          cat > /tmp/expected-files.txt <<'EOF'
          apps/api/src/game_systems/campaign-character-sheets.test.ts
          apps/api/src/game_systems/inventory.test.ts
          apps/api/src/game_systems/pathfinder_2e/character-sheet/manager-provider.ts
          apps/api/src/game_systems/pathfinder_2e/character-sheet/routes.ts
          apps/api/src/game_systems/registry/register.ts
          apps/api/src/modules/campaign-presence/handlers/presence-handlers.ts
          apps/api/src/modules/campaign-presence/mappers.ts
          apps/api/src/modules/campaign-presence/socket.ts
          apps/api/src/modules/campaign_diary/domain/types.ts
          apps/api/src/modules/campaign_scene/presenter.test.ts
          apps/api/src/modules/campaign_scene/presenter.ts
          apps/api/src/modules/campaign_scene/routes.ts
          apps/api/src/modules/campaigns/presenter.test.ts
          apps/api/src/modules/campaigns/presenter.ts
          apps/api/src/modules/campaigns/routes.ts
          apps/api/src/modules/chat/routes.ts
          apps/api/src/modules/chat/socket.ts
          apps/api/src/modules/effect_area/application/ports/area-repository.ts
          apps/api/src/modules/trade/validation.test.ts
          apps/api/src/modules/trade/validation.ts
          apps/api/src/unit.test.ts
          apps/web/src/features/campaigns/pages/CampaignsDashboardPage.tsx
          apps/web/src/layouts/CampaignLayout.tsx
          apps/web/src/vtt/table/domain/boardMath.ts
          apps/web/src/vtt/table/domain/types.ts
          EOF

          sed -i 's/^          //' /tmp/expected-files.txt
          tar -tzf /tmp/campaign-actor-final.tgz | sort > /tmp/archive-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/archive-files.txt

          tar -xzf /tmp/campaign-actor-final.tgz -C .

          python3 - <<'PY'
          from pathlib import Path

          scene_test = Path('apps/api/src/modules/campaign_scene/presenter.test.ts')
          scene_source = scene_test.read_text()
          old_scene = """          actor: {
                      id: 'character-1',
                      userId: 'user-1',
                      campaigns: [{ role: 'PLAYER' }],
                    },"""
          new_scene = """          actor: {
                      mainForMember: { userId: 'user-1', role: 'PLAYER' },
                      controllerMember: { userId: 'user-1' },
                    },"""
          if scene_source.count(old_scene) != 1:
              raise SystemExit('Expected exactly one legacy scene actor fixture')
          scene_test.write_text(scene_source.replace(old_scene, new_scene))

          sheet_test = Path('apps/api/src/game_systems/campaign-character-sheets.test.ts')
          sheet_source = sheet_test.read_text()
          old_sheet = "assert.match(gameSystemRoutesSource, /prisma\\.campaignCharacterSheet\\.create/)"
          new_sheet = "assert.match(gameSystemRoutesSource, /tx\\.campaignCharacterSheet\\.create/)"
          if sheet_source.count(old_sheet) != 1:
              raise SystemExit('Expected exactly one non-transactional sheet create assertion')
          sheet_test.write_text(sheet_source.replace(old_sheet, new_sheet))
          PY

          rm -f \
            scripts/campaign-actor-payload-* \
            scripts/campaign-actor-final.part-01 \
            scripts/campaign-actor-final.part-02 \
            scripts/campaign-actor-final.part-03 \
            scripts/campaign-actor-final.part-04 \
            scripts/campaign-actor-semantic.part-ab \
            scripts/campaign-actor-semantic.part-ac \
            .github/workflows/source-snapshot.yml \
            .github/workflows/campaign-actor-finalize.yml

          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit-tests.log

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-actor-unit-tests
          path: unit-tests.log

      - name: Stop on unit-test failure
        if: steps.unit-tests.outcome == 'failure'
        run: exit 1

      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.test.json

      - name: Build web
        id: build-web
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:web 2>&1 | tee build-web.log

      - name: Upload web-build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-actor-web-build
          path: build-web.log

      - name: Stop on web-build failure
        if: steps.build-web.outcome == 'failure'
        run: exit 1

      - name: Commit validated correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete CampaignActor architecture'
          git push origin HEAD:${{ github.head_ref }}
