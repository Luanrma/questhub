name: Campaign actor semantic fix

on:
  push:
    branches:
      - feat/campaign-actor-inventory-fix
    paths:
      - scripts/campaign-actor-fix.part-00
      - scripts/campaign-actor-fix.part-01
      - .github/workflows/campaign-actor-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/campaign-actor-inventory-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply semantic patch
        run: |
          cat scripts/campaign-actor-fix.part-00 scripts/campaign-actor-fix.part-01 | base64 -d | xz -d > /tmp/campaign-actor.patch
          patch -p1 < /tmp/campaign-actor.patch
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run test:unit
      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.test.json
      - run: npm run build:web
      - name: Commit validated fix
        run: |
          rm -f scripts/campaign-actor-fix.part-00 scripts/campaign-actor-fix.part-01
          rm -f scripts/campaign-actor-semantic.part-ab scripts/campaign-actor-semantic.part-ac
          rm -f .github/workflows/source-snapshot.yml
          rm -f .github/workflows/campaign-actor-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: separate campaign members from actors"
          git push origin HEAD:feat/campaign-actor-inventory-fix
