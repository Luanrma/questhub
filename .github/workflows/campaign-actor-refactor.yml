name: Campaign actor refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/campaign-actor-inventory
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-campaign-actor-refactor.py 2>&1 | tee refactor.log
      - run: npm ci 2>&1 | tee -a refactor.log
      - run: npx prisma generate 2>&1 | tee -a refactor.log
      - run: npx prisma validate 2>&1 | tee -a refactor.log
      - run: npm run test:unit 2>&1 | tee -a refactor.log
      - name: Typecheck API
        run: |
          cat > apps/api/tsconfig.refactor.json <<'JSON'
          {
            "extends": "./tsconfig.test.json",
            "compilerOptions": { "noEmit": true },
            "include": ["src/**/*.ts"],
            "exclude": ["src/**/*.test.ts", "src/unit.test.ts"]
          }
          JSON
          npx tsc -p apps/api/tsconfig.refactor.json 2>&1 | tee -a refactor.log
      - run: npm run build:web 2>&1 | tee -a refactor.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-actor-refactor-log
          path: refactor.log
      - name: Commit validated refactor
        run: |
          rm -f apps/api/tsconfig.refactor.json refactor.log
          rm -f scripts/apply-campaign-actor-refactor.py
          rm -f .github/workflows/campaign-actor-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .ai apps/api apps/web .github/workflows/campaign-actor-refactor.yml scripts/apply-campaign-actor-refactor.py
          git commit -m "refactor: replace Character with CampaignActor" || exit 0
          git push origin HEAD:feat/campaign-actor-inventory
