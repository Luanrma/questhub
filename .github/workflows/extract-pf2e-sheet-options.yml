name: Extract PF2e sheet options

on:
  push:
    branches:
      - feat/pathfinder-character-sheet

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip option extraction]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch development branch
        run: git fetch origin development:refs/remotes/origin/development

      - name: Extract static select names
        run: node scripts/extract-pf2e-sheet-options-from-development.cjs

      - name: Commit extracted catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/game_systems/pathfinder_2e/character-sheet/options
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: extract PF2e sheet option names [skip option extraction]"
          git push
