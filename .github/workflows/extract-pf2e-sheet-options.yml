name: Verify PF2e character sheet phase

on:
  push:
    branches:
      - feat/pathfinder-character-sheet

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip sheet preparation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch development branch
        run: git fetch origin development:refs/remotes/origin/development

      - name: Checkout pinned official deity source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/foundryvtt/pf2e.git /tmp/pf2e-reference
          git -C /tmp/pf2e-reference sparse-checkout set packs/pf2e/deities
          git -C /tmp/pf2e-reference checkout 5069fb7a421a5ba1789652764447cced91ffb0e2

      - name: Extract static select names
        run: node scripts/extract-pf2e-sheet-options-from-development.cjs

      - name: Apply sheet integration
        run: node scripts/apply-pf2e-character-sheet-phase.cjs

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:generate

      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build:web

      - name: Record successful verification
        run: |
          cat > .pf2e-sheet-verification.txt <<'EOF'
          Prisma generate: passed
          Unit tests: passed
          Frontend build: passed
          EOF

      - name: Commit generated catalogs, integration and verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web .pf2e-sheet-verification.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: verify clean PF2e sheet phase [skip sheet preparation]"
          git push
