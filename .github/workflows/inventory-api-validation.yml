name: Inventory API validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: npm run test:unit > unit-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-unit-test-log
          path: unit-test.log
      - name: Report unit test failure
        if: steps.unit_tests.outcome == 'failure'
        run: |
          tail -n 160 unit-test.log
          exit 1
      - name: Typecheck API
        id: api_typecheck
        continue-on-error: true
        run: npx tsc --noEmit --target ES2023 --module CommonJS --moduleResolution node --types node --esModuleInterop --skipLibCheck --strict apps/api/src/main.ts > api-typecheck.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-api-typecheck-log
          path: api-typecheck.log
      - name: Report API typecheck failure
        if: steps.api_typecheck.outcome == 'failure'
        run: |
          cat api-typecheck.log
          exit 1
      - run: npm run build:web
