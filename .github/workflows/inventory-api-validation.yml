name: Inventory API validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: npm run test:unit > unit-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-unit-test-log
          path: unit-test.log
      - name: Report unit test failure
        if: steps.unit_tests.outcome == 'failure'
        run: |
          tail -n 160 unit-test.log
          exit 1
      - name: Typecheck inventory API
        id: inventory_typecheck
        continue-on-error: true
        run: >-
          npx tsc --noEmit --target ES2023 --module ESNext --moduleResolution bundler
          --types node --esModuleInterop --skipLibCheck --strict
          apps/api/src/game_systems/inventory_api/routes.ts
          apps/api/src/game_systems/inventory_api/validation.ts
          apps/api/src/game_systems/inventory_api/stacking.ts
          apps/api/src/game_systems/inventory_api/register.ts
          > inventory-typecheck.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-api-typecheck-log
          path: inventory-typecheck.log
      - name: Report inventory typecheck failure
        if: steps.inventory_typecheck.outcome == 'failure'
        run: |
          cat inventory-typecheck.log
          exit 1
      - name: Build web
        id: web_build
        continue-on-error: true
        run: npm run build:web > web-build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-web-build-log
          path: web-build.log
      - name: Report web build failure
        if: steps.web_build.outcome == 'failure'
        run: |
          tail -n 200 web-build.log
          exit 1
