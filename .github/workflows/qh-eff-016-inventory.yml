name: QH-EFF-016 Translation Inventory

on:
  push:
    branches:
      - feat/qh-eff-016-active-effects-pt-br
  pull_request:
    branches:
      - feat/qh-eff-015-clickable-effect-references
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/qh-eff-016-inventory.mts
      - name: Translation draft endpoint smoke test
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode 'client=gtx' \
            --data-urlencode 'sl=en' \
            --data-urlencode 'tl=pt' \
            --data-urlencode 'dt=t' \
            --data-urlencode 'q=You gain a +1 status bonus to attack and damage rolls.' \
            'https://translate.googleapis.com/translate_a/single'
      - uses: actions/upload-artifact@v4
        with:
          name: qh-eff-016-effect-inventory
          path: qh-eff-016-artifact/
          if-no-files-found: error
