name: QH-EFF-016 Model Smoke

on:
  push:
    branches:
      - feat/qh-eff-016-active-effects-pt-br
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Translate smoke sample
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/payload.json <<'JSON'
          {
            "model": "openai/gpt-4o",
            "temperature": 0,
            "messages": [
              {
                "role": "system",
                "content": "Translate Pathfinder 2e rules text from English to Brazilian Portuguese. Preserve all mechanical meaning and numbers. Return only the translation."
              },
              {
                "role": "user",
                "content": "You gain a +1 status bonus to attack rolls until the start of your next turn."
              }
            ]
          }
          JSON
          curl --fail-with-body --silent --show-error \
            "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d @/tmp/payload.json \
            | tee /tmp/response.json
          grep -q 'bônus' /tmp/response.json
