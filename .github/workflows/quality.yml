name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/questhub

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: questhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d questhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:agent-boundaries
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npx prisma db execute --file apps/api/prisma/invariants.test.sql
      - run: npm run test:unit
      - run: npm run test:agents
      - run: npm run build:agents
      - run: npm run build:web
